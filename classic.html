<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rate Race: A Warehouse Week</title>
<style>
  :root{
    --concrete:#1E2126;
    --steel:#2C3138;
    --steel-lt:#3A3F47;
    --hazard:#F5A800;
    --paper:#EDE9DE;
    --dim:#9BA1AA;
    --lcd-bg:#101C10;
    --lcd:#8FE388;
    --alert:#E8503A;
    --ok:#69C46B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--concrete);}
  body{
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:linear-gradient(180deg,#23262C 0%, #1B1E23 100%);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0 0 48px 0;
  }
  .console{width:100%; max-width:640px;}

  /* ---------- hazard tape ---------- */
  .tape{
    height:12px;
    background:repeating-linear-gradient(45deg, var(--hazard) 0 14px, #17181B 14px 28px);
    border-top:2px solid #14161A;
    border-bottom:2px solid #14161A;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    justify-content:space-between;
    gap:8px;
    background:var(--steel);
    padding:12px 16px;
    border-bottom:2px solid #14161A;
    position:sticky; top:0; z-index:10;
  }
  .hud .stat{flex:1; min-width:0; text-align:center;}
  .hud .lbl{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    font-size:10px; letter-spacing:0.14em; color:var(--dim); text-transform:uppercase;
  }
  .hud .val{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    font-size:17px; font-weight:700; color:var(--paper); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hud .val.warn{color:var(--hazard);}
  .hud .val.bad{color:var(--alert);}
  .hud .val.bump{animation:bump .5s ease;}
  @keyframes bump{0%{transform:scale(1);} 35%{transform:scale(1.3);} 100%{transform:scale(1);}}

  /* ---------- stage ---------- */
  .stage{padding:22px 18px 10px;}
  @media (min-width:520px){ .stage{padding:28px 26px 12px;} }

  .card{
    background:var(--steel);
    border:2px solid #14161A;
    border-left:6px solid var(--hazard);
    padding:20px 20px 22px;
    margin-bottom:18px;
    animation:slidein .35s ease both;
  }
  .card.system{border-left-color:var(--alert);}
  .card.quiet{border-left-color:var(--steel-lt);}
  @keyframes slidein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  .kicker{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--hazard); margin-bottom:8px;
  }
  .card.system .kicker{color:var(--alert);}
  .card h2{
    font-family:Impact,"Arial Narrow Bold","Arial Black",sans-serif;
    font-weight:400; letter-spacing:0.02em;
    font-size:24px; text-transform:uppercase; color:var(--paper);
    margin-bottom:10px; line-height:1.1;
  }
  .card p{font-size:15.5px; line-height:1.55; color:var(--paper); margin-bottom:10px;}
  .card p.dim{color:var(--dim); font-size:13.5px;}
  .card p:last-of-type{margin-bottom:0;}

  .choices{margin-top:18px; display:flex; flex-direction:column; gap:10px;}
  button.choice{
    font-family:inherit; font-size:15px; text-align:left;
    background:transparent; color:var(--paper);
    border:2px solid var(--hazard);
    padding:13px 16px; cursor:pointer;
    transition:background .12s, color .12s;
  }
  button.choice:hover, button.choice:focus-visible{background:var(--hazard); color:#14161A;}
  button.choice small{display:block; font-size:12.5px; opacity:.75; margin-top:3px;}
  button:focus-visible{outline:2px dashed var(--hazard); outline-offset:3px;}

  /* ---------- scanner ---------- */
  .scanner{
    background:#33383F;
    border:3px solid #14161A;
    border-radius:14px 14px 22px 22px;
    padding:14px 14px 18px;
    margin-bottom:18px;
    box-shadow:0 6px 0 #14161A;
    animation:slidein .35s ease both;
  }
  .scanner .brand{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px; letter-spacing:0.22em; color:var(--dim);
    text-transform:uppercase; text-align:center; margin-bottom:8px;
  }
  .screen{
    position:relative;
    background:var(--lcd-bg);
    border:2px solid #0A120A;
    padding:14px 14px 16px;
    min-height:96px;
  }
  .screen::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
  }
  .screen .line{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    font-size:14px; line-height:1.6; color:var(--lcd);
    white-space:pre-wrap; word-break:break-word;
  }
  .screen .line.big{font-size:17px; font-weight:700;}
  .screen .line.typing::after{
    content:"\2588"; color:var(--lcd);
    animation:blink .7s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .timerbar-wrap{height:10px; background:#0A120A; margin-top:12px; border:2px solid #14161A;}
  .timerbar{height:100%; width:100%; background:var(--lcd);}
  .timerbar.low{background:var(--alert); animation:lowblink .32s steps(2,end) infinite;}
  @keyframes lowblink{50%{opacity:.35;}}

  .bins{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;
  }
  @media (max-width:420px){ .bins{grid-template-columns:repeat(3,1fr);} }
  button.bin{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:14px; font-weight:700;
    background:var(--steel-lt); color:var(--hazard);
    border:2px solid #14161A; border-bottom-width:4px;
    padding:16px 4px; cursor:pointer;
  }
  button.bin:hover, button.bin:focus-visible{background:#464C55;}
  button.bin.hit{background:var(--ok); color:#14161A;}
  button.bin.err{background:var(--alert); color:#14161A;}
  .bins.locked button.bin{pointer-events:none; opacity:.85;}

  .conveyor{
    height:10px; margin-top:14px; border:2px solid #14161A;
    background:repeating-linear-gradient(90deg,#464C55 0 22px, #2C3138 22px 44px);
    animation:convey .7s linear infinite;
  }
  @keyframes convey{to{background-position-x:-44px;}}

  .shelf-note{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; color:var(--dim); text-align:center; margin-top:10px;
    letter-spacing:0.1em; text-transform:uppercase;
  }

  /* ---------- walking transitions ---------- */
  .transit{cursor:pointer; animation:slidein .3s ease both;}
  .strip{
    position:relative; height:132px; overflow:hidden;
    border:2px solid #14161A; background:#262A30;
  }
  .strip .belt{
    position:absolute; inset:0; width:calc(100% + 320px);
    background:
      linear-gradient(#101216,#101216) 0 118px / 100% 14px repeat-x,
      repeating-linear-gradient(90deg, transparent 0 16px, #575E67 16px 42px, transparent 42px 54px, #8A7748 54px 76px, transparent 76px 160px) 0 24px / 160px 20px repeat-x,
      repeating-linear-gradient(90deg, transparent 0 30px, #8A7748 30px 52px, transparent 52px 70px, #575E67 70px 96px, transparent 96px 160px) 0 66px / 160px 20px repeat-x,
      linear-gradient(#14161A,#14161A) 0 44px / 100% 5px repeat-x,
      linear-gradient(#14161A,#14161A) 0 86px / 100% 5px repeat-x,
      repeating-linear-gradient(90deg, #14161A 0 7px, transparent 7px 160px) 0 0 / 160px 100% repeat-x;
    animation:scrollstrip 1.1s linear infinite;
  }
  @keyframes scrollstrip{to{transform:translateX(-160px);}}
  .walker{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    animation:bob .26s steps(2) infinite;
  }
  @keyframes bob{50%{transform:translateX(-50%) translateY(-2px);}}
  .walker .leg, .walker .arm{transform-box:fill-box; transform-origin:50% 0%;}
  .walker .leg-l{animation:swingA .5s ease-in-out infinite;}
  .walker .leg-r{animation:swingB .5s ease-in-out infinite;}
  .walker .arm-l{animation:swingB .5s ease-in-out infinite;}
  .walker .arm-r{animation:swingA .5s ease-in-out infinite;}
  @keyframes swingA{0%,100%{transform:rotate(20deg);} 50%{transform:rotate(-20deg);}}
  @keyframes swingB{0%,100%{transform:rotate(-20deg);} 50%{transform:rotate(20deg);}}
  .transit-caption{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    text-align:center; margin-top:14px;
    font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:var(--paper);
    line-height:1.8;
  }
  .transit-steps{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    text-align:center; font-size:11px; letter-spacing:0.12em;
    color:var(--hazard); margin-top:6px; text-transform:uppercase;
  }
  .transit-skip{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    text-align:center; font-size:10px; letter-spacing:0.12em;
    color:var(--dim); margin-top:10px; text-transform:uppercase;
  }

  /* ---------- title & debrief ---------- */
  .title-wrap{text-align:center; padding:38px 10px 8px;}
  .title-wrap h1{
    font-family:Impact,"Arial Narrow Bold","Arial Black",sans-serif;
    font-weight:400; font-size:60px; line-height:.95;
    text-transform:uppercase; color:var(--paper); letter-spacing:0.01em;
  }
  .title-wrap h1 span{color:var(--hazard); display:block;}
  .title-wrap .sub{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:13px; color:var(--dim); margin:14px 0 18px; letter-spacing:0.08em;
  }

  .debrief h3{
    font-family:Impact,"Arial Narrow Bold","Arial Black",sans-serif;
    font-weight:400; font-size:19px; text-transform:uppercase;
    color:var(--hazard); margin:18px 0 6px; letter-spacing:0.03em;
  }
  .debrief ul{margin:8px 0 8px 20px;}
  .debrief li{font-size:15px; line-height:1.55; margin-bottom:8px;}

  .footer{
    text-align:center; padding:26px 20px 8px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; color:var(--dim); letter-spacing:0.08em; line-height:1.8;
  }

  .flash{animation:flashbg .4s ease;}
  @keyframes flashbg{0%{background:#464C55;} 100%{background:var(--lcd-bg);}}

  @media (prefers-reduced-motion: reduce){
    .card,.scanner,.transit{animation:none;}
    button.choice{transition:none;}
    .strip .belt, .walker, .walker .leg, .walker .arm{animation:none;}
    .conveyor{animation:none;}
    .timerbar.low{animation:none;}
    .hud .val.bump{animation:none;}
  }
</style>
</head>
<body>
<div class="console">
  <div class="tape" aria-hidden="true"></div>
  <div class="hud" id="hud" hidden>
    <div class="stat"><div class="lbl">Day</div><div class="val" id="hud-day">Mon</div></div>
    <div class="stat"><div class="lbl">Time</div><div class="val" id="hud-time">6:45a</div></div>
    <div class="stat"><div class="lbl">Rate</div><div class="val" id="hud-rate">--</div></div>
    <div class="stat"><div class="lbl">Body</div><div class="val" id="hud-body">7/10</div></div>
    <div class="stat"><div class="lbl">Flags</div><div class="val" id="hud-flags">0/3</div></div>
  </div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="footer">
    COMM 3008 · Organizational Communication · University of Cincinnati<br>
    A fictional simulation for class discussion. Inspired by ABC News Story Lab's
    "The Amazon Race" (2019) and the Financial Times' "Uber Game" (2017).
  </div>
</div>

<script>
"use strict";

/* ============================================================
   THE RATE RACE: a warehouse week
   Original news-game-style simulation for COMM 3008.
   All company names, characters, and dialogue are fictional.
   ============================================================ */

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  dayIdx: 0,
  body: 7,
  flags: 0,
  risky: 0,
  rounds: [],
  choices: [],
  pace: null,
  tip: false,
  pushHard: false,
  helpCost: false,
  headStart: 0,
  steps: 0,
  solidarity: false,
  mentored: false,
  injured: false,
  quit: false,
  released: false,
  ended: false,
  clock: "6:45a"
};

const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
const stage = document.getElementById("stage");
const hud = document.getElementById("hud");

const ITEMS = [
  "phone case, clear", "yoga mat, teal", "AA batteries, 36 pk",
  "dog toy, squeaky taco", "LED strip lights", "protein powder, vanilla",
  "phone charger, 6 ft", "shower caddy", "puzzle, 1000 pc",
  "desk lamp, black", "water bottle, 32 oz", "gaming mouse",
  "org comm textbook, used", "air fryer liners", "wall hooks, 20 pk",
  "kettle, electric", "hair ties, 100 ct", "notebook, grid"
];
const BINS = ["A-1","A-2","A-3","A-4","B-1","B-2","B-3","B-4","C-1","C-2","C-3","C-4"];

const WALKER_SVG = `
<svg class="walker" viewBox="0 0 32 46" width="58" height="84" aria-hidden="true">
  <rect x="10" y="0" width="12" height="4" fill="#14161A"/>
  <rect x="10" y="4" width="12" height="8" fill="#EDE9DE"/>
  <rect class="arm arm-l" x="5" y="13" width="4" height="11" fill="#EDE9DE"/>
  <rect class="arm arm-r" x="23" y="13" width="4" height="11" fill="#EDE9DE"/>
  <rect x="8" y="12" width="16" height="14" fill="#F5A800"/>
  <rect x="8" y="17" width="16" height="3" fill="#14161A"/>
  <g class="leg leg-l"><rect x="10" y="26" width="5" height="13" fill="#2C3138"/><rect x="9" y="39" width="7" height="4" fill="#14161A"/></g>
  <g class="leg leg-r"><rect x="17" y="26" width="5" height="13" fill="#2C3138"/><rect x="16" y="39" width="7" height="4" fill="#14161A"/></g>
</svg>`;

/* ---------------- helpers ---------------- */

const prevHUD = {};
function updateHUD(){
  const rate = avgRate();
  const vals = {
    "hud-day": DAYS[S.dayIdx] || "Fri",
    "hud-time": S.clock,
    "hud-rate": rate === null ? "--" : rate + "%",
    "hud-body": S.body + "/10",
    "hud-flags": S.flags + "/3"
  };
  const classes = {
    "hud-rate": rate !== null && rate < 75 ? "bad" : rate !== null && rate < 90 ? "warn" : "",
    "hud-body": S.body <= 3 ? "bad" : S.body <= 5 ? "warn" : "",
    "hud-flags": S.flags >= 2 ? "bad" : S.flags === 1 ? "warn" : ""
  };
  for (const id in vals){
    const el = document.getElementById(id);
    const changed = prevHUD[id] !== undefined && prevHUD[id] !== vals[id];
    el.textContent = vals[id];
    el.className = "val" + (classes[id] ? " " + classes[id] : "");
    if (changed && !REDUCED){
      void el.offsetWidth;
      el.classList.add("bump");
      el.addEventListener("animationend", () => el.classList.remove("bump"), {once:true});
    }
    prevHUD[id] = vals[id];
  }
}

function avgRate(){
  if (!S.rounds.length) return null;
  return Math.round(S.rounds.reduce((a,b)=>a+b,0) / S.rounds.length);
}

function fmtSteps(){ return S.steps.toLocaleString("en-US"); }

function setBody(delta){
  S.body = Math.max(0, Math.min(10, S.body + delta));
  updateHUD();
}

function addFlag(){ S.flags++; updateHUD(); }

function clearStage(){ stage.innerHTML = ""; }
function scrollTop(){ window.scrollTo({top:0, behavior:"auto"}); }

/* Walking transition. captionLines: array of strings. */
function transit(captionLines, stepsGained, next){
  S.steps += stepsGained;
  clearStage(); scrollTop(); updateHUD();
  const t = document.createElement("div");
  t.className = "transit";
  t.setAttribute("role", "button");
  t.setAttribute("tabindex", "0");
  t.innerHTML = `
    <div class="strip"><div class="belt"></div>${WALKER_SVG}</div>
    <div class="transit-caption">${captionLines.join("<br>")}</div>
    <div class="transit-steps">Steps so far this week: ${fmtSteps()}</div>
    <div class="transit-skip">tap to skip</div>`;
  stage.appendChild(t);
  let doneCalled = false;
  const go = () => { if (doneCalled) return; doneCalled = true; next(); };
  const id = setTimeout(go, REDUCED ? 300 : 1700);
  const skip = () => { clearTimeout(id); go(); };
  t.addEventListener("click", skip);
  t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") skip(); });
  t.focus({preventScroll:true});
}

/* A narrative card. choices: [{label, note, fn}] */
function card(opts){
  clearStage(); scrollTop();
  const c = document.createElement("div");
  c.className = "card" + (opts.variant ? " " + opts.variant : "");
  let html = "";
  if (opts.kicker) html += `<div class="kicker">${opts.kicker}</div>`;
  if (opts.title)  html += `<h2>${opts.title}</h2>`;
  (opts.body || []).forEach(p => { html += `<p${p.dim ? ' class="dim"' : ''}>${p.t || p}</p>`; });
  c.innerHTML = html;
  const wrap = document.createElement("div");
  wrap.className = "choices";
  (opts.choices || []).forEach(ch => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = ch.label + (ch.note ? `<small>${ch.note}</small>` : "");
    b.addEventListener("click", () => ch.fn());
    wrap.appendChild(b);
  });
  c.appendChild(wrap);
  stage.appendChild(c);
  const first = wrap.querySelector("button");
  if (first) first.focus({preventScroll:true});
}

/* Typewriter for the scanner LCD */
function typeInto(el, text, speed){
  if (REDUCED){ el.textContent = text; return {skip: () => {}}; }
  el.classList.add("typing");
  let i = 0, id = null, finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    clearTimeout(id);
    el.textContent = text;
    el.classList.remove("typing");
  }
  (function tick(){
    if (finished) return;
    el.textContent = text.slice(0, i++);
    if (i <= text.length) id = setTimeout(tick, speed || 12);
    else finish();
  })();
  return {skip: finish};
}

/* A scanner message screen with a single continue action */
function scannerMsg(lines, btnLabel, fn){
  clearStage(); scrollTop();
  const sc = document.createElement("div");
  sc.className = "scanner";
  sc.innerHTML = `
    <div class="brand">SWIFTLINE UNIT 0447 · HANDHELD</div>
    <div class="screen"><div class="line" id="sc-lines"></div></div>`;
  stage.appendChild(sc);
  const el = sc.querySelector("#sc-lines");
  const typer = typeInto(el, lines.join("\n"), 11);
  sc.querySelector(".screen").addEventListener("click", () => typer.skip());
  const wrap = document.createElement("div");
  wrap.className = "choices";
  const b = document.createElement("button");
  b.className = "choice";
  b.textContent = btnLabel;
  b.addEventListener("click", () => { typer.skip(); fn(); });
  wrap.appendChild(b);
  stage.appendChild(wrap);
  b.focus({preventScroll:true});
}

/* ---------------- the pick mini-game ---------------- */

function effectiveSeconds(base){
  let s = base;
  if (S.pace === "jog") s += 0.4;
  if (S.tip) s += 0.4;
  if (S.pushHard) s += 0.3;
  if (S.helpCost) s -= 0.2;
  if (S.body <= 3) s -= 0.6;
  return Math.max(2.4, s);
}

function pickRound(cfg, done){
  clearStage(); scrollTop();
  const secs = effectiveSeconds(cfg.seconds);
  let made = S.headStart; S.headStart = 0;
  let i = 0;
  let answered = false;
  let timeoutId = null;
  let lowId = null;

  const sc = document.createElement("div");
  sc.className = "scanner";
  sc.innerHTML = `
    <div class="brand">SWIFTLINE UNIT 0447 · PICK MODE</div>
    <div class="screen" id="pick-screen">
      <div class="line" id="pick-status"></div>
      <div class="line big" id="pick-target"></div>
    </div>
    <div class="timerbar-wrap"><div class="timerbar" id="tbar"></div></div>
    <div class="bins" id="bins"></div>
    <div class="conveyor" aria-hidden="true"></div>
    <div class="shelf-note">Tap the bin the scanner asks for</div>`;
  stage.appendChild(sc);

  const statusEl = sc.querySelector("#pick-status");
  const targetEl = sc.querySelector("#pick-target");
  const barEl = sc.querySelector("#tbar");
  const binsEl = sc.querySelector("#bins");
  const screenEl = sc.querySelector("#pick-screen");

  BINS.forEach(code => {
    const b = document.createElement("button");
    b.className = "bin";
    b.textContent = code;
    b.dataset.code = code;
    b.addEventListener("click", () => handleClick(b));
    binsEl.appendChild(b);
  });

  let currentBin = null;

  function nextPick(){
    if (i >= cfg.picks){ return finish(); }
    i++;
    answered = false;
    currentBin = BINS[Math.floor(Math.random() * BINS.length)];
    const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    statusEl.textContent = `${cfg.label} · PICK ${i}/${cfg.picks} · MADE ${made}`;
    targetEl.textContent = `${item}\n>> BIN ${currentBin}`;
    screenEl.classList.remove("flash"); void screenEl.offsetWidth; screenEl.classList.add("flash");
    binsEl.classList.remove("locked");
    barEl.style.transition = "none";
    barEl.style.width = "100%";
    barEl.classList.remove("low");
    void barEl.offsetWidth;
    barEl.style.transition = `width ${secs}s linear`;
    barEl.style.width = "0%";
    clearTimeout(lowId);
    lowId = setTimeout(() => { if (!answered) barEl.classList.add("low"); }, secs * 650);
    timeoutId = setTimeout(() => { if (!answered){ answered = true; miss(); } }, secs * 1000);
  }

  function handleClick(btn){
    if (answered) return;
    if (btn.dataset.code === currentBin){
      answered = true;
      clearTimeout(timeoutId);
      clearTimeout(lowId);
      made++;
      btn.classList.add("hit");
      binsEl.classList.add("locked");
      setTimeout(() => { btn.classList.remove("hit"); nextPick(); }, 260);
    } else {
      btn.classList.add("err");
      binsEl.classList.add("locked");
      setTimeout(() => {
        btn.classList.remove("err");
        if (!answered) binsEl.classList.remove("locked");
      }, 450);
    }
  }

  function miss(){
    targetEl.textContent = ">> PICK TIMED OUT";
    binsEl.classList.add("locked");
    setTimeout(nextPick, 550);
  }

  function finish(){
    const pct = Math.min(120, Math.round((made / cfg.target) * 100));
    S.rounds.push(pct);
    S.steps += made * 140 + (cfg.picks - made) * 60;
    updateHUD();
    done({made, pct, target: cfg.target});
  }

  updateHUD();
  nextPick();
}

/* Automated coaching after a weak round. Calls next() either way. */
function coachingCheck(result, next){
  if (result.pct < 75){
    addFlag();
    if (S.flags >= 3) return releaseEnding();
    scannerMsg([
      "MESSAGE FROM: PERFORMANCE SYSTEM",
      "",
      "This is an automatically generated notice.",
      `Your last session rate was ${result.pct}% of target.`,
      "A coaching record has been added to your file.",
      "No reply is needed. No reply is possible.",
      "",
      `FLAGS ON FILE: ${S.flags} OF 3`
    ], "Put the scanner back in the holster", next);
  } else {
    next();
  }
}

  clearStage(); scrollTop();
  const rate = avgRate();
  const chosen = S.choices.slice(0, 8).map(c => `<li>${c}</li>`).join("");

  let peoplePara = "Dee is in this story on purpose. Informal knowledge, shared tips, and plain talk at a lunch table are how workers push back on systems that treat them as data points. File her under what Miller's Chapter 6 calls power, control, and resistance, and notice which conversations this week actually helped you.";
  if (S.solidarity){
    peoplePara += " You put your name on her letter, and something in your schedule changed afterward. You will never know whether that was retaliation or an algorithm shuffling names, and that ambiguity is itself one of the quietest forms of control.";
  }
  if (S.mentored){
    peoplePara += " You also passed what you knew to Marcus. On shop floors, useful knowledge has always moved sideways between workers faster than it moves down from management. That's socialization happening peer to peer, and it's worth remembering when the course gets there.";
  }

  const c = document.createElement("div");
  c.className = "card debrief";
  c.innerHTML = `
    <div class="kicker">Debrief · COMM 3008</div>
    <h2>What you just felt has names</h2>
    <p>Everything in this simulation is fictional, but none of it is invented from nothing.
    Timed tasks, ratcheting targets, logged bathroom trips, automated write-ups, and
    leaderboards all appear across a decade of reporting on warehouse work, including
    the readings in this course.</p>

    <h3>The stopwatch became a scanner</h3>
    <p>This is the world Miller's Chapter 2 calls scientific management: Frederick
    Taylor's program of measuring work, finding the "one best way," and setting output
    standards from above. Your week was Taylorism with better sensors. The difference is
    that Taylor needed a man with a stopwatch, and Swiftline needed nothing but the
    device in your hand.</p>

    <h3>Management without a manager</h3>
    <p>Notice who disciplined you this week. Not a supervisor. A performance system
    generated your coaching records, extended your shift, and ended assignments. Scholars
    call this algorithmic management: control exercised through software that measures,
    directs, and evaluates work automatically. It layers onto the older forms of control
    you've studied, and adds one of its own: the target that rises every time you meet it.</p>

    <h3>Your week, on file</h3>
    <ul>${chosen}</ul>
    <p>Average rate: ${rate === null ? "no sessions completed" : rate + "% of target"}.
    Flags: ${S.flags} of 3. Steps walked: about ${fmtSteps()}.${S.injured ? " Ended by injury." : ""}${S.quit ? " Ended by walking away." : ""}${S.released ? " Assignment ended by the system." : ""}</p>

    <h3>Where the people are</h3>

    <ul>
      <li>Which principles of classical management (Miller Ch. 2) did you recognize this

      <li>Who, or what, was your supervisor? What changes about organizational control

      <li>The target rose every time you met it. Is that a technology problem, a
